model_list:
  # Standard Claude Desktop aliases
  - model_name: "claude-3-5-sonnet-20241022"
    litellm_params:
      model: "z-ai/glm-5.3"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  - model_name: "claude-3-5-haiku-20241022"
    litellm_params:
      model: "meta/llama-3.2-90b-vision-instruct"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  - model_name: "claude-3-opus-20240229"
    litellm_params:
      model: "deepseek-ai/deepseek-v4.1-flash"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  - model_name: "claude-3-opus-20260925"
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # Verified NVIDIA NIM Models
  - model_name: "claude-3-5-sonnet-glm-5.3"
    litellm_params:
      model: "z-ai/glm-5.3"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  - model_name: "claude-3-5-sonnet-kimi-k3"
    litellm_params:
      model: "moonshotai/kimi-k3"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  - model_name: "claude-3-5-sonnet-deepseek-v4.1-flash"
    litellm_params:
      model: "deepseek-ai/deepseek-v4.1-flash"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # Wildcard route (with health check disabled so it doesn't fail /health)
  - model_name: "claude-nim-*"
    litellm_params:
      model: "nvidia_nim/*"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"
    model_info:
      disable_background_health_check: true

litellm_settings:
  drop_params: true
  set_verbose: false
