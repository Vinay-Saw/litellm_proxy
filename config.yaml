model_list:
  # 1. Default / Opus 5.5 (Maps to your primary ultra model)
  - model_name: "claude-3-5-opus-20241022" # Legacy fallback if requested
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  - model_name: "opus-5.5" # The new default recommended option
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # 2. Opus (Standard alias option 2)
  - model_name: "claude-3-opus-20260925"
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # 3. Fable 5.1 (New reasoning/long-running model option)
  - model_name: "fable-5.1"
    litellm_params:
      model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b" # Or replace with a specific long-context model if preferred
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # 4. Sonnet 5.5 (Efficient routine task option)
  - model_name: "sonnet-5.5"
    litellm_params:
      model: "nvidia_nim/z-ai/glm-5.3"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # 5. Haiku 5.5 (Fastest answer option)
  - model_name: "haiku-5.5"
    litellm_params:
      model: "nvidia_nim/moonshotai/kimi-k3"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"

  # Wildcard route for safety
  - model_name: "claude-nim-*"
    litellm_params:
      model: "nvidia_nim/*"
      api_key: "os.environ/NVIDIA_NIM_API_KEY"
    model_info:
      disable_background_health_check: true

litellm_settings:
  drop_params: true
  set_verbose: false
